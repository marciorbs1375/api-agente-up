services:
  api:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /srv
    command:
      - sh
      - -c
      - |
        python -c "import urllib.request,tarfile,io; tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen('https://codeload.github.com/marciorbs1375/api-agente-up/tar.gz/main').read())).extractall('/srv')" &&
        cd /srv/api-agente-up-* &&
        pip install --no-cache-dir -q -r requirements.txt &&
        exec uvicorn app.main:build --factory --host 0.0.0.0 --port 8000
    environment:
      API_KEY_AGENTE: ${API_KEY_AGENTE}
      API_KEY_ADMIN: ${API_KEY_ADMIN}
      ESCRITA_HABILITADA: "false"
      SANKHYA_ENV: ${SANKHYA_ENV:-production}
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID:-}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET:-}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN:-}
      CODVEND_AGENTE: ${CODVEND_AGENTE:-}
      TIPNEG_PADRAO: ${TIPNEG_PADRAO:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTE_MODELO: ${AGENTE_MODELO:-claude-sonnet-5-5}
      AGENTE_LIMITE_DIARIO: ${AGENTE_LIMITE_DIARIO:-3000}
      DB_PATH: /data/agente.db
    volumes:
      - dados:/data
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
volumes:
  dados:
